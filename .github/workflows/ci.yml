name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.run_id }}"
  cancel-in-progress: true

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  check:
    name: check
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.0.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: typecheck and unit tests
        run: make test
      - name: Type-aware lint
        run: pnpm run lint

  installed-browser:
    name: Installed Chromium extension
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TMPDIR: ${{ github.workspace }}/.work/tmp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.0.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install pinned Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Prepare temporary directory
        run: mkdir -p .work/tmp
      - name: Build the production bundle
        run: make dist
      - name: Check embedded assets
        run: pnpm run assets:check
      - name: Exercise the installed extension
        run: pnpm run test:browser extension-onefile/test/browser/extension-runtime.spec.ts extension-onefile/test/browser/capture.spec.ts extension-onefile/test/browser/installed-capture.spec.ts --output=.work/tmp/playwright-results
      - name: Upload Onefile browser failure output
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-onefile
          path: .work/tmp/playwright-results
      - name: Exercise the ChatGPT organizer in the installed suite
        run: |
          export TMPDIR="$PWD/.work/tmp"
          pnpm run test:browser:chatgpt --output="$PWD/.work/tmp/playwright-results-chatgpt"
      - name: Exercise right-click page behavior
        run: pnpm run test:browser:right-click
      - name: Upload ChatGPT browser failure output
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-chatgpt
          path: .work/tmp/playwright-results-chatgpt
