<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Canvas</title>
</head>
<body>
<canvas id="drawn" width="4" height="4"></canvas>
<script>
const canvas = document.getElementById("drawn"),
  context = canvas.getContext("2d");
context.fillStyle = "red";
context.fillRect(0, 0, 4, 4);
</script>
</body>
</html>
